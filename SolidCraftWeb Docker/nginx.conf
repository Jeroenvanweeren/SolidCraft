# Caching follows SolidCraft's service-worker update protocol.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /data/current;
    index index.html;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json application/manifest+json image/svg+xml font/ttf;

    location ^~ /_admin/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "-[0-9a-f]{8,16}(_bg)?\.(js|wasm|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}