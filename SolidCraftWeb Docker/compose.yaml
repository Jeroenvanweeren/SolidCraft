name: solidcraft-web-managed
services:
  solidcraft:
    build: .
    image: solidcraft-web-managed:local
    ports:
      - "${SOLIDCRAFT_PORT:-8080}:8080"
    environment:
      UPDATE_TOKEN: ${SOLIDCRAFT_UPDATE_TOKEN:?Set SOLIDCRAFT_UPDATE_TOKEN before starting}
    volumes:
      - solidcraft-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  solidcraft-data: